name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pyyaml
      - run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the skill zip
        run: cd skills && zip -r ../lifebox-skill.zip lifebox -x '*/__pycache__/*'
      - uses: actions/upload-artifact@v4
        with:
          name: lifebox-skill
          path: lifebox-skill.zip
