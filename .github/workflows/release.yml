name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - run: python -m unittest discover -s tests
      - name: Build the skill zip
        run: cd skills && zip -r ../lifebox-skill.zip lifebox -x '*/__pycache__/*'
      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" lifebox-skill.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
